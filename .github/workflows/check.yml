name: Check userscript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node --check cantrill-sidebar-toggle.user.js

      - name: Metadata check
        run: node tools/check-userscript.mjs
